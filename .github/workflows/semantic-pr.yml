name: Semantic PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  lint-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: lint_pr_title
        with:
          types: |
            feat
            fix
            docs
            style
            chore
            refactor
            test
            ci
            perf
            deps
          requireScope: false
          # Scope (sub-type) is optional and may be any value, e.g. `feat(linux):`, `fix(verify-linux):`
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "Subject must not start with an uppercase letter"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read commit guide
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        id: guide
        run: |
          {
            echo "content<<GUIDE_EOF"
            cat .github/semantic-commit-guide.md
            echo "GUIDE_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        with:
          header: pr-title-lint-error
          message: |
            > [!WARNING]
            > **PR title does not follow the Conventional Commits specification.**

            ${{ steps.lint_pr_title.outputs.error_message }}

            ---

            ${{ steps.guide.outputs.content }}

      - uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        with:
          header: pr-title-lint-error
          delete: true

  check-scope:
    name: Check PR scope
    runs-on: ubuntu-latest
    steps:
      # No `ref:` here: this job runs under pull_request_target with the base
      # repo's GITHUB_TOKEN, so it must check out the trusted base branch
      # (the default ref) rather than fork-controlled code. The PR head is
      # fetched as data only below, never checked out or executed.
      - name: Checkout base (trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head (data only)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Fetch the advertised PR head ref as data only. This does not check
          # out or execute fork-controlled code, preserving the checkout@v7
          # pull_request_target pwn-request protection.
          git fetch --no-tags --no-recurse-submodules origin \
            "refs/pull/${PR_NUMBER}/head"
          fetched_sha="$(git rev-parse FETCH_HEAD)"
          # Ensure the ref still points at the SHA from the event payload, so we
          # classify exactly the reviewed head and never whatever a fork may
          # have pushed after the workflow was triggered.
          if [ "$fetched_sha" != "$HEAD_SHA" ]; then
            echo "::error::PR head ref ($fetched_sha) does not match event head.sha ($HEAD_SHA)."
            exit 1
          fi

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/classify-pr-files.sh

      - uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        if: steps.classify.outputs.mixed == 'true'
        with:
          header: pr-scope-warning
          message: |
            > [!WARNING]
            > **This PR touches 3+ distinct areas of the codebase.**
            >
            > Consider splitting into smaller, focused PRs — each covering a single semantic type.
            > This makes reviews easier and keeps the git history clean.

            ${{ steps.classify.outputs.details }}

      - uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        if: steps.classify.outputs.mixed == 'false'
        with:
          header: pr-scope-warning
          delete: true

      - name: Fail if mixed
        if: steps.classify.outputs.mixed == 'true'
        run: |
          echo "::error::PR touches 3+ distinct areas (ci, docs, code, test, chore). Consider splitting into focused PRs."
          exit 1

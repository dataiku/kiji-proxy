# Reusable workflow: package the Firefox extension. Called by release.yml.
name: Package Firefox Extension (reusable)

on:
  workflow_call:

jobs:
  build-firefox:
    name: Package Firefox Extension
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Version
        id: version
        uses: ./.github/actions/extract-version

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Build Firefox Extension
        run: |
          node src/scripts/build-firefox-extension.js \
            --output firefox-extension \
            --version "${{ steps.version.outputs.version }}"

      - name: Package Extension
        run: |
          cd firefox-extension
          zip -r ../kiji-privacy-proxy-firefox-extension-${{ steps.version.outputs.version }}.zip . \
            -x '*.DS_Store' '*.git*'
          unzip -l ../kiji-privacy-proxy-firefox-extension-${{ steps.version.outputs.version }}.zip

      - name: Generate SHA256 Checksum
        run: |
          sha256sum kiji-privacy-proxy-firefox-extension-${{ steps.version.outputs.version }}.zip \
            > kiji-privacy-proxy-firefox-extension-${{ steps.version.outputs.version }}.zip.sha256

      - name: Upload as Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firefox-assets
          path: |
            kiji-privacy-proxy-firefox-extension-${{ steps.version.outputs.version }}.zip
            kiji-privacy-proxy-firefox-extension-${{ steps.version.outputs.version }}.zip.sha256
          retention-days: 90

version: 2
updates:
  # GitHub Actions - Monitor and update action versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    # Group all GitHub Actions updates into a single PR
    groups:
      github-actions:
        patterns:
          - "*"
    # Even with SHA pinning, Dependabot will update to newer SHAs
    # and add comments showing the version tags

  # npm - Root + workspaces (src/frontend). The only lockfile is the root
  # package-lock.json, so updates must run from "/" to keep it in sync.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    # Default is 5; majors open one PR each on top of the grouped PRs
    open-pull-requests-limit: 10
    # No prefix-development: grouped dev PRs would be titled
    # "deps-dev(...)", which semantic-pr.yml rejects. The scope still shows
    # deps vs deps-dev.
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    # Keep groups disjoint: without exclude-patterns, Dependabot put
    # @tailwindcss/postcss and the native pins in the dev/prod groups instead of
    # tailwind-css (#639, #641, #642).
    groups:
      # Keep Tailwind/lightningcss and their pinned native binaries in lockstep
      tailwind-css:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "lightningcss"
          - "lightningcss-*"
      # Majors match no group below, so each one gets its own PR and a
      # blocked major never holds up the minor/patch batch
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "lightningcss"
          - "lightningcss-*"
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "lightningcss"
          - "lightningcss-*"
    ignore:
      # The lightningcss-* pins in src/frontend/package.json (#583) must match
      # the lightningcss version that @tailwindcss/node pins, not the latest
      # release. Bump them by hand; .github/scripts/check-native-pins.js fails
      # CI when they drift.
      - dependency-name: "lightningcss-*"

  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-dependencies:
        patterns:
          - "*"
